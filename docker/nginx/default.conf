# Server for the NEW PHP 7.1 Application
server {
    listen 8071;
    server_name localhost;
    root /var/www/html; # Points to your new app's root
    index index.php index.html;

    location / {
        # Try to serve file directly, then as directory, then fall back to index.php
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app71:9000; # Pass to the PHP 7.1 service
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}

# Server for the LEGACY PHP 5.6 Application
server {
    listen 8053;
    server_name localhost;
    root /var/www/html; # Points to your legacy app's root
    index index.php index.html;

    location / {
