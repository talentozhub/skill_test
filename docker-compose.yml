version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: simple-php-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./assets/db.sql:/docker-entrypoint-initdb.d/db.sql
    networks:
      - simple-php-network

  # PHP Application
  web:
    build: .
    container_name: simple-php-web
    restart: unless-stopped
    ports:
      - "8000:80"
    depends_on:
      - mysql
    environment:
      - DB_HOST=mysql
      - DB_NAME=test
      - DB_USER=root
      - DB_PASSWORD=root
    volumes:
      - .:/var/www/html
      - /tmp:/tmp
    networks:
      - simple-php-network

volumes:
  mysql_data:

networks:
  simple-php-network:
    driver: bridge
