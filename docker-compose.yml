version: '3.8'

services:
  #--- NEW PHP 7.1 SERVICE ---
  app71:
    build:
      context: ./docker/php71
      dockerfile: Dockerfile
    container_name: awesomecorp_app_php71
    working_dir: /var/www/html
    volumes:
      # Mounts the NEW refactored code
      - ./:/var/www/html
      - ./storage/reports:/var/www/html/storage/reports
      - ./storage/session:/var/www/html/storage/session
    env_file:
      - ./.env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_DATABASE}
      - DB_USER=${DB_USERNAME}
      - DB_PASS=${DB_PASSWORD}
    depends_on:
      - db

  #--- NEW PHP 5.6 SERVICE ---
  app53:
    build:
      context: ./docker/php53
      dockerfile: Dockerfile
    container_name: awesomecorp_app_php53
    working_dir: /var/www/html
    volumes:
      # Mounts the NEW refactored code
      - ./:/var/www/html
      - ./storage/reports:/var/www/html/storage/reports
      - ./storage/session:/var/www/html/storage/session
    env_file:
      - ./.env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_DATABASE}
      - DB_USER=${DB_USERNAME}
      - DB_PASS=${DB_PASSWORD}
      - CSV_REPORT_PATH_CONTAINER=${CSV_REPORT_PATH_CONTAINER}
    depends_on:
      - db

  #--- NGINX SERVICE (Updated) ---
  web:
    image: nginx:1.21-alpine
    container_name: awesomecorp_web
    ports:
      # Port 8071 -> PHP 7.1 App
      - "8071:8071"
      # Port 8053 -> PHP 5.6 App
      - "8053:8053"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app71
      - app53

  #--- DATABASE SERVICE (Unchanged) ---
  db:
    image: mysql:5.7
    container_name: awesomecorp_db_mysql57
    ports:
      - "33069:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes' # <-- Make sure this line exists!
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql # Mount the named volume here

volumes:
  db_data: # Define the named volume